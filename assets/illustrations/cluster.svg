<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none"><style>
.led{animation:blink 2.4s ease-in-out infinite}
.d1{animation-delay:.5s}.d2{animation-delay:1.1s}.d3{animation-delay:1.7s}
.flow{stroke-dasharray:6 10;animation:flow 1.4s linear infinite}
.flow-rev{stroke-dasharray:6 10;animation:flow 1.4s linear infinite reverse}
.slow{animation-duration:2.8s}
.pulse{animation:pulse 3s ease-in-out infinite}
.float{animation:float 6s ease-in-out infinite}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 4s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{0%{stroke-dashoffset:600}50%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
@keyframes grow{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}
</style><defs><radialGradient id="g"><stop offset="0" stop-color="#8cc63f" stop-opacity="0.25"/><stop offset="1" stop-color="#8cc63f" stop-opacity="0"/></radialGradient></defs><ellipse cx="200" cy="278" rx="170" ry="14" fill="url(#g)"/><path d="M200 62L92 214" stroke="#3a3a3a"/><path d="M200 62L92 214" stroke="#8cc63f" stroke-width="1.5" class="flow slow" opacity=".7"/><path d="M92 214L308 214" stroke="#3a3a3a"/><path d="M92 214L308 214" stroke="#8cc63f" stroke-width="1.5" class="flow slow" opacity=".7"/><path d="M308 214L200 62" stroke="#3a3a3a"/><path d="M308 214L200 62" stroke="#8cc63f" stroke-width="1.5" class="flow slow" opacity=".7"/><path d="M200 62L200 158" stroke="#4da3ff" stroke-width="1.5" stroke-dasharray="3 5" opacity=".7"/><path d="M92 214L200 158" stroke="#4da3ff" stroke-width="1.5" stroke-dasharray="3 5" opacity=".7"/><path d="M308 214L200 158" stroke="#4da3ff" stroke-width="1.5" stroke-dasharray="3 5" opacity=".7"/><ellipse cx="200" cy="146" rx="26" ry="8" fill="#202020" stroke="#4da3ff"/><path d="M174 146V172A26 8 0 0 0 226 172V146" fill="#181818" stroke="#4da3ff"/><path d="M174 159A26 8 0 0 0 226 159" stroke="#4da3ff" opacity=".6"/><rect x="158" y="36" width="84" height="52" rx="6" fill="#111111" stroke="#8cc63f"/><path d="M168 52h40M168 64h40M168 76h40" stroke="#2c2c2c" stroke-width="3"/><circle class="led" cx="228" cy="52" r="3" fill="#8cc63f"/><rect x="50" y="188" width="84" height="52" rx="6" fill="#111111" stroke="#3a3a3a"/><path d="M60 204h40M60 216h40M60 228h40" stroke="#2c2c2c" stroke-width="3"/><circle class="led d1" cx="120" cy="204" r="3" fill="#8cc63f"/><rect x="266" y="188" width="84" height="52" rx="6" fill="#111111" stroke="#3a3a3a"/><path d="M276 204h40M276 216h40M276 228h40" stroke="#2c2c2c" stroke-width="3"/><circle class="led d2" cx="336" cy="204" r="3" fill="#8cc63f"/><circle r="4" fill="#e8ffd0"><animateMotion path="M200 62L92 214L308 214Z" dur="4s" repeatCount="indefinite"/></circle></svg>
