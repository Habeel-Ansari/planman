<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none"><style>
.led{animation:blink 2.4s ease-in-out infinite}
.d1{animation-delay:.5s}.d2{animation-delay:1.1s}.d3{animation-delay:1.7s}
.flow{stroke-dasharray:6 10;animation:flow 1.4s linear infinite}
.flow-rev{stroke-dasharray:6 10;animation:flow 1.4s linear infinite reverse}
.slow{animation-duration:2.8s}
.pulse{animation:pulse 3s ease-in-out infinite}
.float{animation:float 6s ease-in-out infinite}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 4s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{0%{stroke-dashoffset:600}50%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
@keyframes grow{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}
</style><defs><radialGradient id="g"><stop offset="0" stop-color="#8cc63f" stop-opacity="0.3"/><stop offset="1" stop-color="#8cc63f" stop-opacity="0"/></radialGradient></defs><ellipse cx="200" cy="270" rx="150" ry="14" fill="url(#g)"/><path d="M160 112A40 40 0 0 1 240 112" stroke="#8cc63f" stroke-width="2" class="pulse" style="animation-delay:0s" fill="none"/><path d="M130 112A70 70 0 0 1 270 112" stroke="#8cc63f" stroke-width="2" class="pulse" style="animation-delay:0.5s" fill="none"/><path d="M100 112A100 100 0 0 1 300 112" stroke="#8cc63f" stroke-width="2" class="pulse" style="animation-delay:1s" fill="none"/><path d="M200 112V150" stroke="#3a3a3a" stroke-width="3"/><circle cx="200" cy="108" r="6" fill="#8cc63f"/><rect x="140" y="150" width="120" height="70" rx="8" fill="#181818" stroke="#3a3a3a"/><rect x="152" y="196" width="10" height="12" rx="1" fill="#111111" stroke="#2c2c2c"/><rect x="168" y="196" width="10" height="12" rx="1" fill="#111111" stroke="#2c2c2c"/><rect x="184" y="196" width="10" height="12" rx="1" fill="#111111" stroke="#2c2c2c"/><rect x="200" y="196" width="10" height="12" rx="1" fill="#111111" stroke="#2c2c2c"/><circle class="led" cx="244" cy="166" r="3" fill="#8cc63f"/><circle class="led d2" cx="232" cy="166" r="3" fill="#4da3ff"/><path d="M140 185L70 210" stroke="#4da3ff" stroke-width="1.5" class="flow"/><circle cx="70" cy="210" r="18" fill="#111111" stroke="#4da3ff"/><circle cx="70" cy="210" r="6" fill="#4da3ff" class="pulse"/><path d="M260 185L330 210" stroke="#4da3ff" stroke-width="1.5" class="flow"/><circle cx="330" cy="210" r="18" fill="#111111" stroke="#4da3ff"/><circle cx="330" cy="210" r="6" fill="#4da3ff" class="pulse"/></svg>
