<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none"><style>
.led{animation:blink 2.4s ease-in-out infinite}
.d1{animation-delay:.5s}.d2{animation-delay:1.1s}.d3{animation-delay:1.7s}
.flow{stroke-dasharray:6 10;animation:flow 1.4s linear infinite}
.flow-rev{stroke-dasharray:6 10;animation:flow 1.4s linear infinite reverse}
.slow{animation-duration:2.8s}
.pulse{animation:pulse 3s ease-in-out infinite}
.float{animation:float 6s ease-in-out infinite}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 4s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{0%{stroke-dashoffset:600}50%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
@keyframes grow{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}
</style><defs><radialGradient id="g"><stop offset="0" stop-color="#8cc63f" stop-opacity="0.22"/><stop offset="1" stop-color="#8cc63f" stop-opacity="0"/></radialGradient></defs><ellipse cx="200" cy="282" rx="170" ry="12" fill="url(#g)"/><rect x="40" y="40" width="320" height="220" rx="10" fill="#111111" stroke="#3a3a3a"/><path d="M40 64H360" stroke="#3a3a3a"/><circle cx="56" cy="52" r="4" fill="#3a3a3a"/><circle cx="70" cy="52" r="4" fill="#3a3a3a"/><circle cx="84" cy="52" r="4" fill="#8cc63f"/><rect x="52" y="76" width="70" height="172" rx="4" fill="#181818"/><path d="M62 94h40" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><path d="M62 118h50" stroke="#8cc63f" stroke-width="3" stroke-linecap="round"/><path d="M62 142h40" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><path d="M62 166h40" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><path d="M62 190h40" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><path d="M62 214h40" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><rect x="134" y="76" width="214" height="96" rx="4" fill="#181818"/><path d="M146 150l26-20 22 10 28-30 26 16 28-24 24 12" stroke="#8cc63f" stroke-width="2.5" stroke-linejoin="round" class="draw"/><rect x="146" y="192" width="16" height="48" rx="2" fill="#8cc63f" opacity=".85" class="grow" style="animation-delay:0s"/><rect x="174" y="192" width="16" height="48" rx="2" fill="#4da3ff" opacity=".85" class="grow" style="animation-delay:0.3s"/><rect x="202" y="192" width="16" height="48" rx="2" fill="#4da3ff" opacity=".85" class="grow" style="animation-delay:0.6s"/><rect x="230" y="192" width="16" height="48" rx="2" fill="#8cc63f" opacity=".85" class="grow" style="animation-delay:0.8999999999999999s"/><rect x="258" y="192" width="16" height="48" rx="2" fill="#4da3ff" opacity=".85" class="grow" style="animation-delay:1.2s"/><rect x="286" y="192" width="16" height="48" rx="2" fill="#4da3ff" opacity=".85" class="grow" style="animation-delay:1.5s"/><rect x