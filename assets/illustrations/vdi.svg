<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none"><style>
.led{animation:blink 2.4s ease-in-out infinite}
.d1{animation-delay:.5s}.d2{animation-delay:1.1s}.d3{animation-delay:1.7s}
.flow{stroke-dasharray:6 10;animation:flow 1.4s linear infinite}
.flow-rev{stroke-dasharray:6 10;animation:flow 1.4s linear infinite reverse}
.slow{animation-duration:2.8s}
.pulse{animation:pulse 3s ease-in-out infinite}
.float{animation:float 6s ease-in-out infinite}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 4s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{0%{stroke-dashoffset:600}50%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
@keyframes grow{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}
</style><defs><radialGradient id="g"><stop offset="0" stop-color="#4da3ff" stop-opacity="0.25"/><stop offset="1" stop-color="#4da3ff" stop-opacity="0"/></radialGradient></defs><ellipse cx="200" cy="282" rx="170" ry="12" fill="url(#g)"/><rect x="40" y="96" width="92" height="110" rx="8" fill="#111111" stroke="#8cc63f" stroke-opacity=".7"/><rect x="52" y="108" width="68" height="16" rx="2" fill="#181818" stroke="#2c2c2c"/><circle class="led" cx="110" cy="116" r="2.4" fill="#8cc63f"/><rect x="52" y="130" width="68" height="16" rx="2" fill="#181818" stroke="#2c2c2c"/><circle class="led d1" cx="110" cy="138" r="2.4" fill="#8cc63f"/><rect x="52" y="152" width="68" height="16" rx="2" fill="#181818" stroke="#2c2c2c"/><circle class="led d2" cx="110" cy="160" r="2.4" fill="#8cc63f"/><rect x="52" y="174" width="68" height="16" rx="2" fill="#181818" stroke="#2c2c2c"/><circle class="led d3" cx="110" cy="182" r="2.4" fill="#8cc63f"/><path d="M132 151C190 151 200 62 220 62" stroke="#3a3a3a"/><path d="M132 151C190 151 200 62 220 62" stroke="#4da3ff" stroke-width="1.5" class="flow" style="animation-delay:0s"/><rect x="220" y="32" width="100" height="58" rx="5" fill="#111111" stroke="#3a3a3a"/><rect x="226" y="38" width="88" height="46" rx="2" fill="#0f1a24"/><path d="M234 74l18-14 14 8 20-18 18 10" stroke="#8cc63f" stroke-width="2" class="draw" style="animation-delay:0s"/><path d="M132 151C190 151 200 150 250 150" stroke="#3a3a3a"/><path d="M132 151C190 151 200 150 250 150" stroke="#4da3ff" stroke-width="1.5" class="flow" style="animation-delay:0.4s"/><rect x="250" y="120" width="100" height="58" rx="5" fill="#111111" stroke="#3a3a3a"/><rect x="256" y="126" width="88" height="46" rx="2" fill="#0f1a24"/><path d="M264 162l18-14 14 8 20-18 18 10" stroke="#4da3ff" stroke-width="2" class="draw" style="animation-delay:0.6s"/><path d="M132 151C190 151 200 238 220 238" stroke="#3a3a3a"/><path d="M132 151C190 151 200 238 220 238" stroke="#4da3ff" stroke-width="1.5" class="flow" style="animation-delay:0.8s"/><rect x="220" y="208" width="100" height="58" rx="5" fill="#111111" stroke="#3a3a3a"/><rect x="226" y="214" width="88" height="46" rx="2" fill="#0f1a24"/><path d="M234 250l18-14 14 8 20-18 18 10" stroke="#c8a2ff" stroke-width="2" class="draw" style="animation-delay:1.2s"/></svg>
