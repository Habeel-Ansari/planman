ff" stroke-opacity=".5"/><path d="M278 200v-24" stroke="#4da3ff" stroke-width="3" class="grow" style="animation-delay:1.4s"/><rect x="70" y="234" width="260" height="8" fill="#202020"/><rect x="58" y="242" width="284" height="8" fill="#181818"/><g class="float"><path d="M318 52l24-10 24 10-24 10z" fill="#8cc63f"/><path d="M328 56v10c8 6 20 6 28 0V56" stroke="#8cc63f" stroke-width="2"/></g></svg>
