<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none"><style>
.led{animation:blink 2.4s ease-in-out infinite}
.d1{animation-delay:.5s}.d2{animation-delay:1.1s}.d3{animation-delay:1.7s}
.flow{stroke-dasharray:6 10;animation:flow 1.4s linear infinite}
.flow-rev{stroke-dasharray:6 10;animation:flow 1.4s linear infinite reverse}
.slow{animation-duration:2.8s}
.pulse{animation:pulse 3s ease-in-out infinite}
.float{animation:float 6s ease-in-out infinite}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 4s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{0%{stroke-dashoffset:600}50%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
@keyframes grow{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}
</style><defs><radialGradient id="g"><stop offset="0" stop-color="#4da3ff" stop-opacity="0.3"/><stop offset="1" stop-color="#4da3ff" stop-opacity="0"/></radialGradient></defs><ellipse cx="200" cy="276" rx="170" ry="14" fill="url(#g)"/><rect x="36" y="70" width="100" height="170" rx="8" fill="#111111" stroke="#3a3a3a"/><rect x="50" y="84" width="72" height="30" rx="3" fill="#181818" stroke="#4da3ff" stroke-opacity=".6"/><path d="M56 104l10-8 10 6 10-10 10 8 10-6" stroke="#4da3ff" stroke-width="2" class="draw"/><circle cx="86" cy="170" r="30" fill="#181818" stroke="#3a3a3a"/><g class="spin"><path d="M86 146v48M62 170h48M69 153l34 34M103 153l-34 34" stroke="#4da3ff" stroke-width="3" opacity=".7"/></g><circle cx="86" cy="170" r="6" fill="#3a3a3a"/><rect x="238" y="70" width="126" height="170" rx="8" fill="#111111" stroke="#3a3a3a"/><rect x="268" y="120" width="66" height="66" rx="6" fill="#181818" stroke="#8cc63f" stroke-opacity=".6"/><path d="M258 132H344M344 132V148H258V164H344V180H258" stroke="#4da3ff" stroke-width="4" stroke-linejoin="round" opacity=".6"/><path d="M258 132H344M344 132V148H258V164H344V180H258" stroke="#cfe7ff" stroke-width="1.5" class="flow"/><path d="M136 110H238" stroke="#4da3ff" stroke-width="7" stroke-linecap="round" opacity=".5"/><path d="M136 110H238" stroke="#cfe7ff" stroke-width="2" class="flow"/><path d="M238 210H136" stroke="#ff9a55" stroke-width="7" stroke-linecap="round" opacity=".5"/><path d="M238 210H136" stroke="#ffd9bd" stroke-width="2" class="flow"/><g class="float"><path d="M187 50c0 0-14 16-14 26a14 14 0 0 0 28 0c0-10-14-26-14-26z" fill="#4da3ff" opacity=".85"/></g></svg>
