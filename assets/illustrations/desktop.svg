<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none"><style>
.led{animation:blink 2.4s ease-in-out infinite}
.d1{animation-delay:.5s}.d2{animation-delay:1.1s}.d3{animation-delay:1.7s}
.flow{stroke-dasharray:6 10;animation:flow 1.4s linear infinite}
.flow-rev{stroke-dasharray:6 10;animation:flow 1.4s linear infinite reverse}
.slow{animation-duration:2.8s}
.pulse{animation:pulse 3s ease-in-out infinite}
.float{animation:float 6s ease-in-out infinite}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 4s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{0%{stroke-dashoffset:600}50%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
@keyframes grow{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}
</style><defs><radialGradient id="g"><stop offset="0" stop-color="#8cc63f" stop-opacity="0.35"/><stop offset="1" stop-color="#8cc63f" stop-opacity="0"/></radialGradient></defs><ellipse cx="200" cy="262" rx="130" ry="16" fill="url(#g)"/><g class="float"><path d="M130 110L166 76H300L264 110Z" fill="#202020" stroke="#3a3a3a"/><path d="M264 110L300 76V200L264 236Z" fill="#141414" stroke="#3a3a3a"/><rect x="130" y="110" width="134" height="126" rx="6" fill="#181818" stroke="#3a3a3a"/><circle cx="146" cy="130" r="2.4" fill="#3a3a3a"/><circle cx="159" cy="130" r="2.4" fill="#3a3a3a"/><circle cx="172" cy="130" r="2.4" fill="#3a3a3a"/><circle cx="185" cy="130" r="2.4" fill="#3a3a3a"/><circle cx="198" cy="130" r="2.4" fill="#3a3a3a"/><circle cx="211" cy="130" r="2.4" fill="#3a3a3a"/><circle cx="224" cy="130" r="2.4" fill="#3a3a3a"/><circle cx="237" cy="130" r="2.4" fill="#3a3a3a"/><circle cx="250" cy="130" r="2.4" fill="#3a3a3a"/><circle cx="146" cy="143" r="2.4" fill="#3a3a3a"/><circle cx="159" cy="143" r="2.4" fill="#3a3a3a"/><circle cx="172" cy="143" r="2.4" fill="#3a3a3a"/><circle cx="185" cy="143" r="2.4" fill="#3a3a3a"/><circle cx="198" cy="143" r="2.4" fill="#3a3a3a"/><circle cx="211" cy="143" r="2.4" fill="#3a3a3a"/><circle cx="224" cy="143" r="2.4" fill="#3a3a3a"/><circle cx="237" cy="143" r="2.4" fill="#3a3a3a"/><circle cx="250" cy="143" r="2.4" fill="#3a3a3a"/><circle cx="146" cy="156" r="2.4" fill="#3a3a3a"/><circle cx="159" cy="156" r="2.4" fill="#3a3a3a"/><circle cx="172" cy="156" r="2.4" fill="#3a3a3a"/><circle cx="185" cy="156" r="2.4" fill="#3a3a3a"/><circle cx="198" cy="156" r="2.4" fill="#3a3a3a"/><circle cx="211" cy="156" r="2.4" fill="#3a3a3a"/><circle cx="224" cy="156" r="2.4" fill="#3a3a3a"/><circle cx="237" cy="156" r="2.4" fill="#3a3a3a"/><circle cx="250" cy="156" r="2.4" fill="#3a3a3a"/><circle cx="146" cy="169" r="2.4" fill="#3a3a3a"/><circle cx="159" cy="169" r="2.4" fill="#3a3a3a"/><circle cx="172" cy="169" r="2.4" fill="#3a3a3a"/><circle cx="185"